<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Curriculum vitae of Chujia Yu. View or download the full PDF.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#eef2fa">
    <meta name="referrer" content="no-referrer">
    <title>Chujia Yu | Curriculum Vitae</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        color: #17243b;
        background: #eef2fa;
      }

      * { box-sizing: border-box; }

      body { margin: 0; }

      .skip-link {
        position: absolute;
        top: -60px;
        left: 15px;
        z-index: 10;
        padding: 8px 12px;
        background: #fff;
        color: #3158a0;
      }

      .skip-link:focus { top: 10px; }

      .site-nav-bar { background: #fff; border-bottom: 1px solid #e4e8f0; }

      .nav-inner {
        max-width: 1060px;
        min-height: 66px;
        margin: 0 auto;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand { color: #17243b; font-size: 19px; font-weight: 700; text-decoration: none; }
      .site-nav { display: flex; flex-wrap: wrap; gap: 8px 22px; }
      .site-nav a { color: #44546e; font-size: 14px; text-decoration: none; }
      .site-nav a:hover, .site-nav a:focus-visible { text-decoration: underline; }
      .site-nav a[aria-current="page"] { color: #17243b; font-weight: 700; }

      .cv-header {
        max-width: 1060px;
        margin: 0 auto;
        padding: 42px 24px 28px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 28px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #4267ac;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(32px, 5vw, 50px);
        font-weight: 500;
        line-height: 1.1;
      }

      .subtitle {
        margin: 12px 0 0;
        color: #53627d;
        font-size: 15px;
        line-height: 1.5;
      }

      .actions { display: flex; flex-wrap: wrap; gap: 10px; }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 17px;
        border: 1px solid #3158a0;
        border-radius: 8px;
        background: #3158a0;
        color: #fff;
        font-size: 14px;
        font-weight: 650;
        text-decoration: none;
        white-space: nowrap;
        transition: background-color .15s, border-color .15s;
      }

      .button:hover, .button:focus-visible { background: #24447d; border-color: #24447d; }

      .button.secondary { background: transparent; color: #3158a0; }

      .button.secondary:hover, .button.secondary:focus-visible {
        background: #e1e9f7;
        color: #24447d;
      }

      .button:focus-visible { outline: 3px solid #98b5eb; outline-offset: 3px; }

      main { max-width: 1060px; margin: 0 auto; padding: 0 24px 56px; }

      .paper {
        display: block;
        width: 100%;
        max-width: 850px;
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 14px 48px rgba(22, 38, 72, .16), 0 2px 8px rgba(22, 38, 72, .07);
      }

      .paper img { display: block; width: 100%; height: auto; }

      .fallback {
        margin: 22px auto 0;
        max-width: 850px;
        color: #53627d;
        font-size: 13px;
        line-height: 1.5;
        text-align: center;
      }

      .fallback a { color: #3158a0; }

      @media (max-width: 700px) {
        .nav-inner { align-items: start; flex-direction: column; }
        .site-nav { gap: 8px 14px; }
        .site-nav a { font-size: 13px; }
        .cv-header { align-items: start; flex-direction: column; padding-top: 28px; }
        .actions { width: 100%; }
        .button { flex: 1; }
        main { padding: 0 12px 32px; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to CV</a>
    <header class="site-nav-bar">
      <div class="nav-inner">
        <a class="brand" href="index.html">Chujia Yu</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="research.html">Research Experience</a>
          <a href="cv.html" aria-current="page">CV</a>
          <a href="about.html">About Myself</a>
        </nav>
      </div>
    </header>
    <section class="cv-header" aria-labelledby="cv-title">
      <div>
        <p class="eyebrow">Curriculum Vitae</p>
        <h1 id="cv-title">Chujia Yu</h1>
        <p class="subtitle">Transportation research · System dynamics · Future urban mobility</p>
      </div>
      <nav class="actions" aria-label="CV actions">
        <a class="button" href="cv.pdf" target="_blank" rel="noopener">Open PDF</a>
        <a class="button secondary" href="cv.pdf" download="Chujia-Yu-CV.pdf">Download CV</a>
      </nav>
    </section>

    <main id="main">
      <a class="paper" href="cv.pdf" target="_blank" rel="noopener" aria-label="Open Chujia Yu's full CV as a PDF">
        <img src="cv-preview.png" width="1132" height="1600" alt="Preview of Chujia Yu's one-page curriculum vitae, including education, research interests, publications, experience and skills.">
      </a>
      <p class="fallback">For selectable text or a higher resolution view, <a href="cv.pdf" target="_blank" rel="noopener">open the original PDF</a>.</p>
    </main>
  </body>
</html>
